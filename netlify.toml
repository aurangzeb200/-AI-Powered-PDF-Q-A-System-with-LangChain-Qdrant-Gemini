[build]
  command = "npm ci && npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist"

[dev]
  command = "npm --prefix frontend run dev"
  targetPort = 5173

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
